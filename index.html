<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>吳清鋒SDGs 不塑永續-淨灘</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }

        /* 雲朵動畫 */
        @keyframes moveClouds {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100vw); }
        }
        .cloud {
            position: absolute;
            animation: moveClouds linear infinite;
            opacity: 0.85;
        }

        /* 海浪動畫 */
        @keyframes waveMove {
            0%, 100% { transform: translateY(0) scaleY(1); }
            50% { transform: translateY(-8px) scaleY(1.05); }
        }
        .wave {
            animation: waveMove 3s ease-in-out infinite;
        }

        /* 垃圾 hover 與點擊動畫 */
        .trash-item {
            transition: transform 0.2s ease, opacity 0.25s ease;
            cursor: pointer;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.25));
        }
        .trash-item:hover {
            transform: scale(1.25) rotate(var(--rot)) !important;
            filter: drop-shadow(0px 0px 10px rgba(255, 255, 255, 0.9)) drop-shadow(2px 4px 6px rgba(0,0,0,0.3));
            z-index: 40;
        }
        .trash-item.collected {
            transform: scale(0) rotate(var(--rot)) !important;
            opacity: 0;
            pointer-events: none;
        }

        /* 飄浮分數提示 */
        @keyframes floatUp {
            0% { opacity: 1; transform: translate(-50%, 0) scale(1); }
            50% { opacity: 1; transform: translate(-50%, -30px) scale(1.3); }
            100% { opacity: 0; transform: translate(-50%, -60px) scale(0.9); }
        }
        .score-popup {
            position: absolute;
            animation: floatUp 0.8s ease-out forwards;
            font-weight: 900;
            text-shadow: 0px 2px 4px rgba(0,0,0,0.5);
            pointer-events: none;
            z-index: 50;
        }

        /* 水滴波紋效果 */
        @keyframes ripple {
            0% { transform: scale(0.2); opacity: 0.8; }
            100% { transform: scale(1.8); opacity: 0; }
        }
        .ripple-effect {
            position: absolute;
            border: 3px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            animation: ripple 0.5s ease-out forwards;
            pointer-events: none;
            z-index: 45;
        }
    </style>
</head>
<body class="h-screen w-screen relative bg-sky-300">

    <!-- 頂部 UI 列 -->
    <header class="absolute top-0 left-0 right-0 p-4 md:p-6 z-30 flex justify-between items-start pointer-events-none">
        <!-- 頁首標題 (左上角) -->
        <div class="pointer-events-auto bg-white/80 backdrop-blur-md px-5 py-3 rounded-2xl shadow-lg border border-white/50">
            <h1 class="text-2xl md:text-4xl font-black text-teal-800 tracking-wide">
                吳清鋒SDGs 不塑永續-淨灘
            </h1>
            <p class="text-xs md:text-sm font-semibold text-teal-600 mt-1">
                守護海洋環境 ‧ 清潔海岸線
            </p>
        </div>

        <!-- 分數與關卡成績 (右上角) -->
        <div class="pointer-events-auto bg-white/80 backdrop-blur-md px-5 py-3 rounded-2xl shadow-lg border border-white/50 flex flex-col md:flex-row gap-3 md:gap-6 items-end md:items-center">
            <div class="text-right">
                <span class="text-xs font-bold text-gray-500 block uppercase tracking-wider">當前關卡</span>
                <span id="level-display" class="text-xl md:text-2xl font-black text-amber-600">第 1 關</span>
            </div>
            <div class="w-px h-8 bg-gray-300 hidden md:block"></div>
            <div class="text-right">
                <span class="text-xs font-bold text-gray-500 block uppercase tracking-wider">剩餘垃圾</span>
                <span id="remaining-display" class="text-xl md:text-2xl font-black text-rose-500">50 / 50</span>
            </div>
            <div class="w-px h-8 bg-gray-300 hidden md:block"></div>
            <div class="text-right">
                <span class="text-xs font-bold text-gray-500 block uppercase tracking-wider">累積積分</span>
                <span id="score-display" class="text-2xl md:text-3xl font-black text-teal-600">0</span>
            </div>
        </div>
    </header>

    <!-- 背景天色與雲朵 -->
    <div class="absolute inset-0 z-0 overflow-hidden bg-gradient-to-b from-sky-400 via-sky-200 to-cyan-100">
        <!-- 太陽 -->
        <div class="absolute top-6 left-1/2 -translate-x-1/2 w-32 h-32 bg-amber-200 rounded-full blur-xl opacity-60"></div>
        <div class="absolute top-10 left-1/2 -translate-x-1/2 w-20 h-20 bg-amber-300 rounded-full shadow-inner"></div>

        <!-- 動態雲朵 -->
        <div class="cloud top-8 w-32 h-12 bg-white rounded-full blur-[1px]" style="animation-duration: 35s; animation-delay: -5s;"></div>
        <div class="cloud top-20 w-48 h-16 bg-white/90 rounded-full blur-[1px]" style="animation-duration: 45s; animation-delay: -18s;"></div>
        <div class="cloud top-12 w-40 h-14 bg-white/80 rounded-full blur-[1px]" style="animation-duration: 28s; animation-delay: -10s;"></div>
    </div>

    <!-- 海洋區塊 (上半部與中間過渡區) -->
    <div class="absolute top-[35%] left-0 right-0 bottom-0 z-10 pointer-events-none">
        <!-- 深海區域 -->
        <div class="h-16 bg-cyan-600/60 wave"></div>
        <!-- 淺海區域 -->
        <div class="h-16 -mt-8 bg-teal-400/70 wave" style="animation-delay: -1.5s;"></div>
        <!-- 浪花白邊 -->
        <div class="h-12 -mt-8 bg-gradient-to-b from-white/80 to-transparent wave" style="animation-delay: -0.7s;"></div>
    </div>

    <!-- 海灘區塊 (網頁下半部 50% 高度) -->
    <main id="beach-area" class="absolute bottom-0 left-0 right-0 h-1/2 z-20 bg-gradient-to-b from-amber-200 via-amber-100 to-amber-200 shadow-inner overflow-hidden">
        <!-- 沙灘紋理裝飾線與小貝殼點綴 -->
        <div class="absolute inset-0 opacity-20 pointer-events-none bg-[radial-gradient(#d97706_1px,transparent_1px)] [background-size:16px_16px]"></div>
        
        <!-- 海浪邊界裝飾區 -->
        <div class="absolute top-0 left-0 right-0 h-6 bg-gradient-to-b from-teal-200/50 to-transparent"></div>

        <!-- 垃圾將在此處動態生成 -->
    </main>

    <!-- 任務成功 / 關卡結算彈窗 Modal -->
    <div id="success-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-white rounded-3xl p-8 md:p-10 max-w-md w-11/12 text-center shadow-2xl border-4 border-amber-300 transform scale-95 transition-transform duration-300" id="modal-card">
            <div class="w-24 h-24 bg-amber-100 rounded-full flex items-center justify-center mx-auto mb-4 text-5xl shadow-inner">
                🏆
            </div>
            <h2 class="text-3xl font-black text-gray-800 mb-2">任務成功！</h2>
            <p class="text-gray-600 mb-6 font-medium">
                感謝您付出辛勞清理海灘！海洋因您的付出而變得更加美麗淨潔。
            </p>

            <div class="bg-amber-50 rounded-2xl p-4 mb-6 flex justify-around border border-amber-200">
                <div>
                    <span class="text-xs text-gray-500 font-bold block">本關清理</span>
                    <span class="text-xl font-black text-amber-600">50 個垃圾</span>
                </div>
                <div class="w-px bg-amber-200"></div>
                <div>
                    <span class="text-xs text-gray-500 font-bold block">當前總分</span>
                    <span id="modal-score" class="text-xl font-black text-teal-600">0</span>
                </div>
            </div>

            <button id="next-level-btn" class="w-full py-4 bg-gradient-to-r from-teal-500 to-emerald-600 hover:from-teal-600 hover:to-emerald-700 text-white font-black text-lg rounded-xl shadow-lg shadow-teal-500/30 transform active:scale-95 transition-all">
                前往下一關 ➔
            </button>
        </div>
    </div>

    <!-- 遊戲邏輯與腳本 -->
    <script>
        // -------------------------------------------------------------
        // Web Audio API 音效生成器 (無外部音檔依賴)
        // -------------------------------------------------------------
        class SoundFX {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
            }

            playPop(size) {
                this.init();
                if (!this.ctx) return;

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                // 根據體積調整音高 (小垃圾音調較高，大垃圾音調較低沉)
                const baseFreq = size === 'small' ? 600 : (size === 'medium' ? 450 : 300);

                osc.type = 'sine';
                osc.frequency.setValueAtTime(baseFreq, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.5, this.ctx.currentTime + 0.1);

                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.12);
            }

            playSuccess() {
                this.init();
                if (!this.ctx) return;

                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                notes.forEach((freq, index) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime + index * 0.1);

                    gain.gain.setValueAtTime(0, this.ctx.currentTime + index * 0.1);
                    gain.gain.linearRampToValueAtTime(0.3, this.ctx.currentTime + index * 0.1 + 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + index * 0.1 + 0.3);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(this.ctx.currentTime + index * 0.1);
                    osc.stop(this.ctx.currentTime + index * 0.1 + 0.3);
                });
            }
        }

        const soundFX = new SoundFX();

        // -------------------------------------------------------------
        // SVG 垃圾圖示資料集 (含種類、體積與對應積分)
        // -------------------------------------------------------------
        const TRASH_TYPES = [
            {
                name: '保特瓶',
                size: 'medium',
                points: 20,
                width: 36,
                height: 64,
                svg: `<svg viewBox="0 0 40 80" class="w-full h-full"><path d="M15,5 L25,5 L25,12 L30,18 L30,70 A5,5 0 0,1 25,75 L15,75 A5,5 0 0,1 10,70 L10,18 L15,12 Z" fill="#38bdf8" opacity="0.85" stroke="#0284c7" stroke-width="2"/><rect x="13" y="2" width="14" height="5" rx="1" fill="#ef4444"/><rect x="10" y="30" width="20" height="25" fill="#3b82f6" opacity="0.6"/><line x1="15" y1="20" x2="15" y2="65" stroke="#ffffff" stroke-width="2" opacity="0.6"/></svg>`
            },
            {
                name: '小寶特瓶',
                size: 'small',
                points: 10,
                width: 24,
                height: 44,
                svg: `<svg viewBox="0 0 40 80" class="w-full h-full"><path d="M15,5 L25,5 L25,12 L30,18 L30,70 A5,5 0 0,1 25,75 L15,75 A5,5 0 0,1 10,70 L10,18 L15,12 Z" fill="#a7f3d0" opacity="0.85" stroke="#059669" stroke-width="2"/><rect x="13" y="2" width="14" height="5" rx="1" fill="#10b981"/><rect x="10" y="32" width="20" height="20" fill="#34d399" opacity="0.7"/></svg>`
            },
            {
                name: '紙餐盒',
                size: 'large',
                points: 30,
                width: 70,
                height: 50,
                svg: `<svg viewBox="0 0 80 60" class="w-full h-full"><polygon points="10,15 70,15 75,50 5,50" fill="#fde68a" stroke="#d97706" stroke-width="3"/><polygon points="5,15 15,5 65,5 75,15" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><line x1="20" y1="30" x2="60" y2="30" stroke="#b45309" stroke-width="2" stroke-dasharray="4"/><text x="40" y="42" font-size="10" text-anchor="middle" fill="#92400e" font-weight="bold">ECO</text></svg>`
            },
            {
                name: '塑膠袋',
                size: 'medium',
                points: 20,
                width: 50,
                height: 55,
                svg: `<svg viewBox="0 0 60 65" class="w-full h-full"><path d="M15,20 C10,5 20,2 25,15 C28,2 38,5 35,20 C45,20 55,30 50,55 C45,62 15,62 10,55 C5,30 15,20 15,20 Z" fill="#e0e7ff" opacity="0.8" stroke="#6366f1" stroke-width="2"/><path d="M22,25 C25,35 35,35 38,25" fill="none" stroke="#818cf8" stroke-width="2"/></svg>`
            },
            {
                name: '保麗龍塊',
                size: 'large',
                points: 30,
                width: 65,
                height: 48,
                svg: `<svg viewBox="0 0 70 50" class="w-full h-full"><polygon points="5,10 55,5 68,35 15,45" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><polygon points="55,5 68,35 60,45 48,15" fill="#e2e8f0"/><circle cx="25" cy="25" r="3" fill="#cbd5e1"/><circle cx="35" cy="20" r="2" fill="#cbd5e1"/><circle cx="45" cy="30" r="4" fill="#cbd5e1"/></svg>`
            },
            {
                name: '碎保麗龍',
                size: 'small',
                points: 10,
                width: 26,
                height: 26,
                svg: `<svg viewBox="0 0 30 30" class="w-full h-full"><polygon points="5,5 25,3 28,22 8,27" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/></svg>`
            },
            {
                name: '飲料杯',
                size: 'medium',
                points: 20,
                width: 40,
                height: 55,
                svg: `<svg viewBox="0 0 45 60" class="w-full h-full"><polygon points="8,15 37,15 32,55 13,55" fill="#f472b6" opacity="0.85" stroke="#db2777" stroke-width="2"/><rect x="5" y="10" width="35" height="6" rx="2" fill="#fbcfe8" stroke="#db2777" stroke-width="1.5"/><line x1="28" y1="2" x2="18" y2="35" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/></svg>`
            },
            {
                name: '漂流木',
                size: 'large',
                points: 30,
                width: 85,
                height: 35,
                svg: `<svg viewBox="0 0 90 40" class="w-full h-full"><path d="M5,20 Q25,10 45,22 T85,15 Q80,30 45,28 T5,20 Z" fill="#78350f" stroke="#451a03" stroke-width="2"/><path d="M20,16 Q35,22 55,18" fill="none" stroke="#92400e" stroke-width="2"/><path d="M65,17 L75,8" stroke="#451a03" stroke-width="3" stroke-linecap="round"/></svg>`
            },
            {
                name: '鐵罐',
                size: 'small',
                points: 10,
                width: 28,
                height: 38,
                svg: `<svg viewBox="0 0 30 40" class="w-full h-full"><rect x="4" y="6" width="22" height="28" rx="3" fill="#94a3b8" stroke="#475569" stroke-width="2"/><ellipse cx="15" cy="6" rx="11" ry="3" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/><line x1="4" y1="16" x2="26" y2="16" stroke="#ef4444" stroke-width="2"/></svg>`
            }
        ];

        // -------------------------------------------------------------
        // 遊戲狀態與核心邏輯
        // -------------------------------------------------------------
        const TOTAL_TRASH_COUNT = 50;
        let score = 0;
        let remainingTrash = TOTAL_TRASH_COUNT;
        let currentLevel = 1;

        const beachArea = document.getElementById('beach-area');
        const scoreDisplay = document.getElementById('score-display');
        const remainingDisplay = document.getElementById('remaining-display');
        const levelDisplay = document.getElementById('level-display');
        const successModal = document.getElementById('success-modal');
        const modalCard = document.getElementById('modal-card');
        const modalScore = document.getElementById('modal-score');
        const nextLevelBtn = document.getElementById('next-level-btn');

        // 初始化遊戲關卡
        function initGame(level = 1) {
            currentLevel = level;
            remainingTrash = TOTAL_TRASH_COUNT;
            
            // 更新 UI
            levelDisplay.innerText = `第 ${currentLevel} 關`;
            remainingDisplay.innerText = `${remainingTrash} / ${TOTAL_TRASH_COUNT}`;
            scoreDisplay.innerText = score;

            // 清空沙灘上的舊垃圾
            beachArea.innerHTML = `
                <div class="absolute inset-0 opacity-20 pointer-events-none bg-[radial-gradient(#d97706_1px,transparent_1px)] [background-size:16px_16px]"></div>
                <div class="absolute top-0 left-0 right-0 h-6 bg-gradient-to-b from-teal-200/50 to-transparent"></div>
            `;

            // 產生 50 個垃圾
            spawnTrashItems(TOTAL_TRASH_COUNT);
        }

        // 生成垃圾物件
        function spawnTrashItems(count) {
            const containerWidth = beachArea.clientWidth;
            const containerHeight = beachArea.clientHeight;

            for (let i = 0; i < count; i++) {
                // 隨機選擇一種垃圾類型
                const type = TRASH_TYPES[Math.floor(Math.random() * TRASH_TYPES.length)];
                
                // 創建 Element
                const trashEl = document.createElement('div');
                trashEl.className = 'trash-item absolute flex items-center justify-center select-none';
                trashEl.style.width = `${type.width}px`;
                trashEl.style.height = `${type.height}px`;

                // 隨機角度 0 ~ 360 度
                const rotation = Math.floor(Math.random() * 360);
                trashEl.style.setProperty('--rot', `${rotation}deg`);
                trashEl.style.transform = `rotate(${rotation}deg)`;

                // 隨機散佈在海灘區域內 (保留邊距避免超出螢幕)
                const paddingX = 40;
                const paddingYTop = 30; // 避免過度靠近浪花
                const paddingYBottom = 40;

                const posX = Math.random() * (containerWidth - type.width - paddingX * 2) + paddingX;
                const posY = Math.random() * (containerHeight - type.height - paddingYTop - paddingYBottom) + paddingYTop;

                trashEl.style.left = `${posX}px`;
                trashEl.style.top = `${posY}px`;

                // 載入 SVG 內容
                trashEl.innerHTML = type.svg;

                // 綁定點擊與觸控事件
                trashEl.addEventListener('click', (e) => collectTrash(e, trashEl, type));

                beachArea.appendChild(trashEl);
            }
        }

        // 清理垃圾處理
        function collectTrash(event, element, type) {
            if (element.classList.contains('collected')) return;

            // 標記已撿起
            element.classList.add('collected');

            // 計算與加算分數
            score += type.points;
            remainingTrash--;

            // 更新 UI
            scoreDisplay.innerText = score;
            remainingDisplay.innerText = `${remainingTrash} / ${TOTAL_TRASH_COUNT}`;

            // 播放音效與動畫效果
            soundFX.playPop(type.size);
            createFloatingScore(event.clientX, event.clientY, `+${type.points}`, type.size);
            createRipple(event.clientX, event.clientY);

            // 移除 DOM 節點
            setTimeout(() => {
                if (element.parentNode) {
                    element.parentNode.removeChild(element);
                }
            }, 250);

            // 檢查是否全數撿完
            if (remainingTrash === 0) {
                setTimeout(showSuccessModal, 500);
            }
        }

        // 顯示浮動加分文字 (+10, +20, +30)
        function createFloatingScore(x, y, text, size) {
            const popup = document.createElement('div');
            popup.className = 'score-popup';

            // 依分數設定顏色與大小
            if (size === 'large') {
                popup.classList.add('text-amber-400', 'text-2xl');
            } else if (size === 'medium') {
                popup.classList.add('text-teal-300', 'text-xl');
            } else {
                popup.classList.add('text-white', 'text-lg');
            }

            popup.innerText = text;
            popup.style.left = `${x}px`;
            popup.style.top = `${y}px`;

            document.body.appendChild(popup);

            setTimeout(() => {
                if (popup.parentNode) popup.parentNode.removeChild(popup);
            }, 800);
        }

        // 點擊水波紋效果
        function createRipple(x, y) {
            const ripple = document.createElement('div');
            ripple.className = 'ripple-effect';
            ripple.style.width = '50px';
            ripple.style.height = '50px';
            ripple.style.left = `${x - 25}px`;
            ripple.style.top = `${y - 25}px`;

            document.body.appendChild(ripple);

            setTimeout(() => {
                if (ripple.parentNode) ripple.parentNode.removeChild(ripple);
            }, 500);
        }

        // 顯示「任務成功」Modal
        function showSuccessModal() {
            soundFX.playSuccess();
            modalScore.innerText = score;

            successModal.classList.remove('opacity-0', 'pointer-events-none');
            modalCard.classList.remove('scale-95');
            modalCard.classList.add('scale-100');
        }

        // 前往下一關按鈕
        nextLevelBtn.addEventListener('click', () => {
            // 隱藏 Modal
            successModal.classList.add('opacity-0', 'pointer-events-none');
            modalCard.classList.remove('scale-100');
            modalCard.classList.add('scale-95');

            // 進入下一關
            initGame(currentLevel + 1);
        });

        // 視窗大小改變時重新佈局沙灘 (防止垃圾超出邊界)
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                initGame(currentLevel);
            }, 300);
        });

        // 頁面載入完成後啟動遊戲
        window.onload = () => {
            initGame(1);
        };
    </script>
</body>
</html>
